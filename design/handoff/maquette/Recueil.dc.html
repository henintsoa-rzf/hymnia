<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hymnia · Cantiques d’exemple</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hymnia-app.css">
<link rel="stylesheet" href="ds/hymnia/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&amp;family=Instrument+Sans:wght@400..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hy-app {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans)">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0">
    <a class="hb-icon-btn" href="Recueils.dc.html" aria-label="Retour aux recueils"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink-muted)">Recueils</span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 8px">
    <div>
      <h1 class="hy-screen-title">Cantiques d’exemple</h1>
      <p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-muted)">CE · 10 chants</p>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 8px">
      <label style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink)">Aller au numéro</span>
        <span class="hb-search">
          <input type="text" inputmode="text" autocomplete="off" enterkeyhint="go" placeholder="Par exemple 12a" value="{{goValue}}" onChange="{{onGoInput}}" onKeyDown="{{onGoKey}}">
        </span>
      </label>
      <button type="button" class="hb-btn" onClick="{{go}}">Aller</button>
    </div>
    <sc-if value="{{hasGoMsg}}" hint-placeholder-val="{{false}}">
      <p role="status" style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted)">{{goMsg}}</p>
    </sc-if>
  </div>

  <main id="ce-list" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 0 16px 24px">
    <ol class="hb-list" aria-label="Chants du recueil, par numéro" style="border-top: 1px solid var(--line)">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
        <li class="{{r.cls}}" id="{{r.domId}}">
          <a class="hb-item__link" href="Chant.dc.html" aria-label="{{r.aria}}">
            <span class="hb-item__num">{{r.num}}</span>
            <span class="hb-item__text"><span class="hb-item__title">{{r.title}}</span></span>
          </a>
        </li>
      </sc-for>
    </ol>
  </main>

  <nav class="hy-tabbar" aria-label="Navigation principale">
    <a class="hy-tab" href="Main.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Recherche</a>
    <a class="hy-tab" href="Recueils.dc.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"></path><path d="M5 20.5A2.5 2.5 0 0 0 7.5 23H19v-5M9 7h6"></path></svg>Recueils</a>
    <a class="hy-tab" href="Lists.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>Répertoire</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Jour","Soir"],"default":"Jour"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { goValue: '12a', target: '12a', goMsg: '' };
  }
  renderVals() {
    var self = this;
    var CE = [
      ['1', 'À toi la gloire'],
      ['2', 'C’est un rempart que notre Dieu'],
      ['3', 'Torrents d’amour et de grâce'],
      ['5', 'Plus près de toi, mon Dieu'],
      ['7', 'Quel ami fidèle et tendre'],
      ['8', 'Tel que je suis'],
      ['12', 'Debout, sainte cohorte'],
      ['12a', 'Que Dieu se montre seulement'],
      ['20', 'Il est né le divin Enfant'],
      ['23', 'Minuit, chrétiens']
    ];
    var key = function (s) { return String(s).toLowerCase().replace(/\s+/g, '').replace(/^n°/, ''); };
    var go = function () {
      var v = key(self.state.goValue);
      if (!v) return;
      var hit = CE.filter(function (r) { return key(r[0]) === v; })[0];
      if (!hit) {
        self.setState({ target: '', goMsg: 'Pas de n° ' + self.state.goValue.trim() + ' dans ce recueil.' });
        return;
      }
      self.setState({ target: hit[0], goMsg: '' }, function () {
        var el = document.getElementById('ce-n-' + key(hit[0]));
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
      });
    };
    var theme = this.props.theme ?? 'Jour';
    return {
      themeClass: theme === 'Soir' ? 'hy-evening' : 'hy-day',
      goValue: this.state.goValue,
      onGoInput: function (e) { self.setState({ goValue: e.target.value }); },
      onGoKey: function (e) { if (e.key === 'Enter') go(); },
      go: go,
      hasGoMsg: !!this.state.goMsg,
      goMsg: this.state.goMsg,
      rows: CE.map(function (r) {
        return {
          num: r[0], title: r[1], domId: 'ce-n-' + key(r[0]),
          aria: 'CE ' + r[0] + ', ' + r[1],
          cls: r[0] === self.state.target ? 'hb-item is-target' : 'hb-item'
        };
      })
    };
  }
}
</script>
</body>
</html>
